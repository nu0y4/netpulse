name: ci

# 由 repository_dispatch 触发：目标列表走 client_payload 传入，
# 不落仓库、不产生提交，运行结束后由本地删除整条运行记录。

on:
  repository_dispatch:
    types: [scan]

permissions:
  contents: read

jobs:
  j:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: dep
        run: pip install --quiet aiohttp charset-normalizer

      - name: prep
        env:
          P: ${{ github.event.client_payload.t }}
        run: |
          if [ -z "$P" ]; then echo 'no payload'; exit 1; fi
          python -c "import base64,os;open('t.txt','wb').write(base64.b64decode(os.environ['P']))"
          echo "targets: $(wc -l < t.txt)"

      - name: run
        run: |
          python runner.py -l t.txt -o out.jsonl
          echo "rows: $(wc -l < out.jsonl)"

      - uses: actions/upload-artifact@v4
        with:
          name: r
          path: out.jsonl
          retention-days: 1